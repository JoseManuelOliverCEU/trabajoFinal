services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-trabajoFinal}
      MARIADB_USER: ${MARIADB_USER:-trabajoFinal}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-trabajoFinal}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
    ports:
      - "3307:3306"   # HeidiSQL: host 3307 -> container 3306
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MARIADB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30


  web:
    build: .
    volumes:
      - .:/app
    environment:
      DATABASE_URL: mysql+pymysql://${MARIADB_USER:-trabajoFinal}:${MARIADB_PASSWORD:-trabajoFinal}@db:3306/${MARIADB_DATABASE:-trabajoFinal}
      API_BASE_URL: http://127.0.0.1:5000/api
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "gunicorn -b 0.0.0.0:5000 wsgi:app"



volumes:
  db_data:
